<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>extend</title>
</head>
<body>
    <script>
        (function () {
            const now = new Date()
            let offset = now.getTimezoneOffset()
            let dst = 60
            if ((now.getMonth()<3)&&(now.getDate()<10))
            {dst = 0}
            if ((now.getMonth()>9)&&(now.getDate()>2))
            {dst = 0}
            switch (offset)
            {
                case (300 - 720 - dst): offset = 'East Coast'; break
                case (360 - 720 - dst): offset = 'Central'; break
                case (420 - 720 - dst): offset = 'Mountain'; break
                case (480 - 720 - dst): offset = 'Pacific'; break
                default: offset = 'All'
            }
            console.log ('System Time: ' + now.toString())
            console.log ('UTC (GMT) Time: ' + now.toUTCString())
            console.log ('\n Welcome to ' + offset + ' Visitors')
        } ) ()
    </script>
</body>
</html>
