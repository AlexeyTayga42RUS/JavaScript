<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>extend</title>
</head>
<body>
    <script>
        (function () {
            let hues = ['Red', 'RED', 'red', 'Green', 'Blue']
            let nums = [1, 20, 3, 17, 14, 0.5]
            console.log('Colors: ' + hues)
            console.log('Dictionary Sort: ' + hues.sort())
            console.log('\nNumbers: ' + nums)
            console.log('Reversed Without Sort: ' + nums.reverse())
            console.log('Dictionary Sort: ' + nums.sort())
            // console.log('Reversed Without Sort: ' + nums.reverse())
            console.log('Numeric Sort: ' + nums.sort(sortNums))
            console.log('Reversed Sort: ' + nums.reverse())
            function sortNums(numOne, numTwo) {  // Функция сравнения чисел, если не использовать, то реверс будет не корректный
                return numOne - numTwo
            }
        } ) ()
    </script>
</body>
</html>
