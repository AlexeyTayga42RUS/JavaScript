<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>break</title>
</head>
<body>
    <script>
        (function () {
            
            let i=0, j=0
            
            for (i=1; i<=5; i++){
                console.log('Outer Loop ' + i)

                for (j=1; j<=5; j++){
                    console.log("\tInner Loop: " + j)

                    if ((i===3)&&(j===2)){
                        console.log("\tSkipped: " + j)
                        continue
                    }
                    if ((i===4)&&(j===2)){
                        console.log("\tBroken: " + j)
                        break
                    }

                }
            }

            
        } ) ()
    </script>
</body>
</html>
