<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Морской бой | Звук уничтожения кораблей (стабильная версия)</title>
    <style>
        * {
            user-select: none;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: #0b2b1f;
            border-radius: 48px;
            padding: 20px 30px 30px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 4px rgba(255,255,255,0.1);
            border: 1px solid #5b8c6f;
        }

        .boards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            margin-bottom: 25px;
        }

        .board-wrapper {
            background: #03170e;
            border-radius: 24px;
            padding: 12px;
            box-shadow: inset 0 0 0 2px #2e6b4a, 0 10px 20px rgba(0,0,0,0.3);
        }

        .board-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #f7eac5;
            text-shadow: 2px 2px 0 #1e3a2f;
            letter-spacing: 1px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(10, 34px);
            grid-template-rows: repeat(10, 34px);
            gap: 2px;
            background-color: #1b4d36;
            padding: 6px;
            border-radius: 12px;
        }

        .cell {
            background-color: #1e3e2e;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.05s linear;
            cursor: pointer;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 1px 0 rgba(255,255,255,0.1);
        }

        .computer-board .cell {
            cursor: pointer;
        }

        .computer-board .cell:hover {
            filter: brightness(1.2);
            transform: scale(0.98);
            background-color: #2d7053;
        }

        .cell.ship {
            background-color: #3c8c68;
            box-shadow: inset 0 0 0 1px #6abf96;
        }

        .cell.hit {
            background-color: #c73d23;
            box-shadow: inset 0 0 0 1px #ff9e7a;
            color: white;
        }

        .cell.miss {
            background-color: #2a4a3a;
            background-image: radial-gradient(circle at 30% 35%, #7faa8f 1.2px, transparent 1.5px);
            background-size: 8px 8px;
            color: #bdd4bf;
        }

        .cell.ship.hit {
            background-color: #b02a0c;
            text-shadow: 0 0 2px darkred;
        }

        .info-panel {
            background: #0a2118;
            border-radius: 60px;
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
            backdrop-filter: blur(2px);
            border: 1px solid #417c5d;
        }

        .turn-indicator {
            background: #00000066;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #ffefb9;
            letter-spacing: 1px;
        }

        .turn-indicator span {
            color: #ffd966;
            text-transform: uppercase;
        }

        .message-area {
            background: #071e15;
            padding: 6px 18px;
            border-radius: 28px;
            font-family: monospace;
            font-weight: bold;
            font-size: 1rem;
            color: #e3f0e6;
            min-width: 180px;
            text-align: center;
        }

        button {
            background: #d6a447;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            padding: 8px 20px;
            border-radius: 40px;
            font-family: inherit;
            cursor: pointer;
            transition: 0.1s linear;
            color: #212121;
            box-shadow: 0 3px 0 #6b3e1a;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #6b3e1a;
        }

        button.reset-btn {
            background: #3f7860;
            color: #fcf9ea;
            box-shadow: 0 3px 0 #1e462f;
        }

        .sound-btn {
            background: #2c5a48;
            color: #ffe6b3;
            box-shadow: 0 3px 0 #1a3a2c;
            font-size: 0.9rem;
        }

        @media (max-width: 780px) {
            .board {
                grid-template-columns: repeat(10, 28px);
                grid-template-rows: repeat(10, 28px);
                gap: 1px;
            }
            .board-wrapper {
                padding: 8px;
            }
            .cell {
                font-size: 16px;
            }
            .info-panel {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="boards">
        <div class="board-wrapper">
            <div class="board-title">⚓ МОЙ ФЛОТ ⚓</div>
            <div class="board player-board" id="playerBoardGrid"></div>
        </div>
        <div class="board-wrapper">
            <div class="board-title">🦾 ФЛОТ ПРОТИВНИКА 🦾</div>
            <div class="board computer-board" id="computerBoardGrid"></div>
        </div>
    </div>

    <div class="info-panel">
        <div class="turn-indicator">⚡ ХОД: <span id="turnText">ИГРОК</span></div>
        <div class="message-area" id="gameMessage">Нажми на клетку врага!</div>
        <button id="soundEnableBtn" class="sound-btn">🔊 ВКЛЮЧИТЬ ЗВУК</button>
        <button id="resetGameBtn" class="reset-btn">🔄 НОВАЯ ИГРА</button>
        <button id="reshuffleBtn">♻️ ПЕРЕСТАВИТЬ МОИ КОРАБЛИ</button>
    </div>
</div>

<script>
    // ---------- СТАБИЛЬНАЯ ЗВУКОВАЯ СИСТЕМА (без ScriptProcessorNode) ----------
    let audioCtx = null;
    let soundAllowed = false;

    // Функция для инициализации контекста по кнопке
    function enableSound() {
        if (audioCtx === null) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                console.warn("Web Audio не поддерживается");
                return;
            }
        }
        // Возобновляем, если в suspended
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().then(() => {
                soundAllowed = true;
                document.getElementById('gameMessage').innerText = '🔊 Звук включён! Приятной игры.';
                setTimeout(() => {
                    if (gameActive) document.getElementById('gameMessage').innerText = 'Атакуйте противника!';
                }, 1500);
            }).catch(e => console.warn);
        } else {
            soundAllowed = true;
            document.getElementById('gameMessage').innerText = '🔊 Звук уже активен';
        }
    }

    // Генерация короткого шумового взрыва (без утечек)
    function playSinkSound() {
        if (!soundAllowed || !audioCtx || audioCtx.state !== 'running') return;
        const now = audioCtx.currentTime;
        // Основной низкочастотный удар
        const osc = audioCtx.createOscillator();
        const gainOsc = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(90, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.35);
        gainOsc.gain.setValueAtTime(0.35, now);
        gainOsc.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gainOsc);
        gainOsc.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.45);

        // Шумовая компонента (генерируем AudioBuffer)
        const duration = 0.3;
        const sampleRate = audioCtx.sampleRate;
        const bufferSize = duration * sampleRate;
        const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            // затухающий белый шум
            const envelope = Math.exp(-i / (sampleRate * 0.08));
            data[i] = (Math.random() * 2 - 1) * 0.45 * envelope;
        }
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = buffer;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.4, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        noiseSource.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noiseSource.start(now);
        noiseSource.stop(now + duration);
    }

    function playHitSound() {
        if (!soundAllowed || !audioCtx || audioCtx.state !== 'running') return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1000, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.2);
    }

    function playMissSound() {
        if (!soundAllowed || !audioCtx || audioCtx.state !== 'running') return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.1);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.15);
    }

    // ---------- ИГРОВАЯ ЛОГИКА (без изменений, стабильная) ----------
    const SIZE = 10;
    const SHIPS = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];

    let playerBoard = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
    let playerShots = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
    let computerBoard = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
    let computerShots = Array(SIZE).fill().map(() => Array(SIZE).fill(0));

    let gameActive = true;
    let currentTurn = 'player';
    let priorityTargets = [];

    const playerGridEl = document.getElementById('playerBoardGrid');
    const computerGridEl = document.getElementById('computerBoardGrid');
    const turnTextSpan = document.getElementById('turnText');
    const gameMessageDiv = document.getElementById('gameMessage');
    const resetBtn = document.getElementById('resetGameBtn');
    const reshuffleBtn = document.getElementById('reshuffleBtn');
    const soundEnableBtn = document.getElementById('soundEnableBtn');

    soundEnableBtn.addEventListener('click', () => {
        enableSound();
    });

    function canPlaceShip(board, row, col, size, orientation) {
        if (orientation === 'horizontal') {
            if (col + size > SIZE) return false;
            for (let i = -1; i <= size; i++) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const r = row + dr;
                        const c = col + i + dc;
                        if (r >= 0 && r < SIZE && c >= 0 && c < SIZE) {
                            if (i >= 0 && i < size && dr === 0 && dc === 0) continue;
                            if (board[r][c] === 1) return false;
                        }
                    }
                }
            }
        } else {
            if (row + size > SIZE) return false;
            for (let i = -1; i <= size; i++) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const r = row + i + dr;
                        const c = col + dc;
                        if (r >= 0 && r < SIZE && c >= 0 && c < SIZE) {
                            if (i >= 0 && i < size && dr === 0 && dc === 0) continue;
                            if (board[r][c] === 1) return false;
                        }
                    }
                }
            }
        }
        return true;
    }

    function placeShipOnBoard(board, row, col, size, orientation) {
        if (orientation === 'horizontal') {
            for (let i = 0; i < size; i++) board[row][col + i] = 1;
        } else {
            for (let i = 0; i < size; i++) board[row + i][col] = 1;
        }
    }

    function randomPlaceShips(board) {
        for (let i = 0; i < SIZE; i++) {
            for (let j = 0; j < SIZE; j++) board[i][j] = 0;
        }
        for (let shipSize of SHIPS) {
            let placed = false;
            let attempts = 0;
            while (!placed && attempts < 2000) {
                const orientation = Math.random() < 0.5 ? 'horizontal' : 'vertical';
                let row, col;
                if (orientation === 'horizontal') {
                    row = Math.floor(Math.random() * SIZE);
                    col = Math.floor(Math.random() * (SIZE - shipSize + 1));
                } else {
                    row = Math.floor(Math.random() * (SIZE - shipSize + 1));
                    col = Math.floor(Math.random() * SIZE);
                }
                if (canPlaceShip(board, row, col, shipSize, orientation)) {
                    placeShipOnBoard(board, row, col, shipSize, orientation);
                    placed = true;
                }
                attempts++;
            }
            if (!placed) {
                randomPlaceShips(board);
                return;
            }
        }
    }

    function getShipCells(board, startRow, startCol) {
        if (board[startRow][startCol] !== 1) return [];
        const queue = [{row: startRow, col: startCol}];
        const visited = new Set();
        const shipCells = [];
        while (queue.length) {
            const {row, col} = queue.shift();
            const key = `${row},${col}`;
            if (visited.has(key)) continue;
            visited.add(key);
            if (board[row][col] === 1) {
                shipCells.push({row, col});
                const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                for (let [dr, dc] of dirs) {
                    const nr = row + dr, nc = col + dc;
                    if (nr>=0 && nr<SIZE && nc>=0 && nc<SIZE && board[nr][nc] === 1 && !visited.has(`${nr},${nc}`)) {
                        queue.push({row: nr, col: nc});
                    }
                }
            }
        }
        return shipCells;
    }

    function markSurroundingCells(board, shots, shipCells) {
        const surroundSet = new Set();
        for (let cell of shipCells) {
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = cell.row + dr;
                    const nc = cell.col + dc;
                    if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
                        if (board[nr][nc] !== 1 && shots[nr][nc] === 0) {
                            surroundSet.add(`${nr},${nc}`);
                        }
                    }
                }
            }
        }
        for (let coord of surroundSet) {
            const [r, c] = coord.split(',').map(Number);
            shots[r][c] = 1;
        }
    }

    function handleSinkIfNeeded(board, shots, row, col) {
        const shipCells = getShipCells(board, row, col);
        if (shipCells.length === 0) return false;
        let allHit = true;
        for (let cell of shipCells) {
            if (shots[cell.row][cell.col] !== 2) {
                allHit = false;
                break;
            }
        }
        if (allHit) {
            markSurroundingCells(board, shots, shipCells);
            return true;
        }
        return false;
    }

    function isGameOver(board, shots) {
        for (let i = 0; i < SIZE; i++) {
            for (let j = 0; j < SIZE; j++) {
                if (board[i][j] === 1 && shots[i][j] !== 2) return false;
            }
        }
        return true;
    }

    function processShot(board, shots, row, col) {
        if (shots[row][col] !== 0) return { hit: false, sunk: false, gameEnded: false, winner: null };
        let hit = false;
        if (board[row][col] === 1) {
            shots[row][col] = 2;
            hit = true;
        } else {
            shots[row][col] = 1;
        }
        let sunk = false;
        if (hit) {
            sunk = handleSinkIfNeeded(board, shots, row, col);
        }
        const gameEnded = isGameOver(board, shots);
        let winner = null;
        if (gameEnded) {
            winner = (board === computerBoard) ? 'player' : 'computer';
            gameActive = false;
        }
        return { hit, sunk, gameEnded, winner };
    }

    function renderAll() {
        renderPlayerField();
        renderComputerField();
        updateUI();
    }

    function renderPlayerField() {
        playerGridEl.innerHTML = '';
        for (let i = 0; i < SIZE; i++) {
            for (let j = 0; j < SIZE; j++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                if (playerBoard[i][j] === 1) cell.classList.add('ship');
                if (playerShots[i][j] === 2) {
                    cell.classList.add('hit');
                    cell.textContent = '💥';
                } else if (playerShots[i][j] === 1) {
                    cell.classList.add('miss');
                    cell.textContent = '·';
                } else if (playerBoard[i][j] === 1 && playerShots[i][j] !== 2) {
                    cell.textContent = '⬤';
                    cell.style.fontSize = '18px';
                    cell.style.color = '#d9ffcf';
                }
                playerGridEl.appendChild(cell);
            }
        }
    }

    function renderComputerField() {
        computerGridEl.innerHTML = '';
        for (let i = 0; i < SIZE; i++) {
            for (let j = 0; j < SIZE; j++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                if (computerShots[i][j] === 2) {
                    cell.classList.add('hit');
                    cell.textContent = '💥';
                } else if (computerShots[i][j] === 1) {
                    cell.classList.add('miss');
                    cell.textContent = '·';
                }
                cell.addEventListener('click', (function(r,c) {
                    return function() { playerAttack(r,c); };
                })(i,j));
                computerGridEl.appendChild(cell);
            }
        }
    }

    function updateUI() {
        turnTextSpan.innerText = currentTurn === 'player' ? 'ИГРОК' : 'КОМПЬЮТЕР';
        if (!gameActive) turnTextSpan.innerText = '🏆 КОНЕЦ';
    }

    function setMessage(msg) {
        gameMessageDiv.innerText = msg;
    }

    function playerAttack(row, col) {
        if (!gameActive) {
            setMessage('Игра окончена. Начните новую!');
            return;
        }
        if (currentTurn !== 'player') {
            setMessage('Сейчас ход компьютера!');
            return;
        }
        if (computerShots[row][col] !== 0) {
            setMessage('Сюда уже стреляли!');
            return;
        }

        const result = processShot(computerBoard, computerShots, row, col);
        renderAll();

        if (result.hit) {
            playHitSound();
            if (result.sunk) {
                playSinkSound();
                setMessage(`💥 УНИЧТОЖЕНИЕ! Корабль противника потоплен! Доп. ход.`);
            } else {
                setMessage(`🎯 ПОПАДАНИЕ! Ещё ход.`);
            }
        } else {
            playMissSound();
            setMessage(`💧 ПРОМАХ! Ход переходит компьютеру.`);
            currentTurn = 'computer';
            updateUI();
            setTimeout(() => computerMove(), 350);
        }

        if (result.gameEnded) {
            setMessage(`🎉 ПОБЕДА! Вы уничтожили весь флот! 🎉`);
            gameActive = false;
            updateUI();
            return;
        }
        if (!result.hit) return;
        updateUI();
    }

    function addPriorityTargetsFromHit(row, col) {
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        for (let [dr, dc] of dirs) {
            const nr = row + dr, nc = col + dc;
            if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && playerShots[nr][nc] === 0) {
                if (!priorityTargets.some(t => t.row === nr && t.col === nc)) {
                    priorityTargets.push({row: nr, col: nc});
                }
            }
        }
    }

    function clearPriorityTargets() { priorityTargets = []; }

    function computerMove() {
        if (!gameActive || currentTurn !== 'computer') return;
        setTimeout(() => {
            if (!gameActive || currentTurn !== 'computer') return;

            let target = null;
            while (priorityTargets.length > 0) {
                const candidate = priorityTargets.shift();
                if (playerShots[candidate.row][candidate.col] === 0) {
                    target = candidate;
                    break;
                }
            }
            if (!target) {
                const freeCells = [];
                for (let i = 0; i < SIZE; i++) {
                    for (let j = 0; j < SIZE; j++) {
                        if (playerShots[i][j] === 0) freeCells.push({row: i, col: j});
                    }
                }
                if (freeCells.length === 0) return;
                const rand = Math.floor(Math.random() * freeCells.length);
                target = freeCells[rand];
            }

            const result = processShot(playerBoard, playerShots, target.row, target.col);
            renderAll();

            if (result.gameEnded) {
                setMessage(`💀 ПОРАЖЕНИЕ... Компьютер уничтожил ваш флот.`);
                gameActive = false;
                updateUI();
                return;
            }

            if (result.hit) {
                playHitSound();
                if (result.sunk) {
                    playSinkSound();
                    setMessage(`🤖 Компьютер ПОТОПИЛ ваш корабль! Ход переходит к вам.`);
                    clearPriorityTargets();
                    currentTurn = 'player';
                } else {
                    setMessage(`🤖 Компьютер ПОПАЛ! Продолжает ход.`);
                    addPriorityTargetsFromHit(target.row, target.col);
                    currentTurn = 'computer';
                    setTimeout(() => computerMove(), 400);
                    return;
                }
            } else {
                playMissSound();
                setMessage(`🤖 Компьютер промахнулся! Ваш ход.`);
                currentTurn = 'player';
            }
            updateUI();
            if (currentTurn === 'computer' && gameActive) setTimeout(() => computerMove(), 300);
        }, 200);
    }

    function initGame() {
        randomPlaceShips(playerBoard);
        randomPlaceShips(computerBoard);
        for (let i = 0; i < SIZE; i++) {
            for (let j = 0; j < SIZE; j++) {
                playerShots[i][j] = 0;
                computerShots[i][j] = 0;
            }
        }
        currentTurn = 'player';
        gameActive = true;
        priorityTargets = [];
        setMessage('Новая игра! Нажмите "Включить звук" для эффектов.');
        renderAll();
    }

    function reshuffleMyShips() {
        if (!gameActive) { initGame(); return; }
        if (currentTurn !== 'player') {
            setMessage('Сейчас ход компьютера, подождите!');
            return;
        }
        initGame();
        setMessage('Ваши корабли переставлены! Новая партия.');
    }

    resetBtn.addEventListener('click', () => { initGame(); });
    reshuffleBtn.addEventListener('click', () => { reshuffleMyShips(); });

    initGame();
    // Не создаём AudioContext до кнопки — избегаем подвисаний
</script>
</body>
</html>
